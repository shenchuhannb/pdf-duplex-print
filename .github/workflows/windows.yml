name: Windows regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install dependencies
        shell: powershell
        run: |
          $log = & .venv\Scripts\python -m pip install --upgrade pip 2>&1 | Out-String
          $log += & .venv\Scripts\python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-build.txt 2>&1 | Out-String
          Write-Output $log
          if ($LASTEXITCODE -ne 0) {
            $log -split "`r?`n" | Select-Object -Last 12 | ForEach-Object {
              Write-Output "::error title=pip-dependency-install::$_"
            }
            exit 1
          }
      - name: Run tests
        shell: powershell
        run: |
          $log = & .venv\Scripts\python -m pytest -q 2>&1 | Out-String
          Write-Output $log
          if ($LASTEXITCODE -ne 0) {
            $log -split "`r?`n" | Select-Object -Last 20 | ForEach-Object {
              Write-Output "::error title=pytest::$($_)"
            }
            exit 1
          }
      - name: Run audit probes
        run: |
          .venv\Scripts\python docs/audit_evidence/pdf_config_probe.py
          .venv\Scripts\python docs/audit_evidence/integration_probe.py
      - name: Build and verify frozen app
        shell: cmd
        run: tools\build_exe.bat ".venv"
